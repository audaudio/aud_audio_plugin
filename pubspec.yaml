name: aud_audio_plugin
description: "Format-agnostic core of the plugin shells of the Audanika Audio Engine: engine over the headless host, plugin configuration, presets, state, MIDI and transport."
version: 0.1.0
publish_to: none
homepage: https://github.com/audaudio/aud_audio_plugin
repository: https://github.com/audaudio/aud_audio_plugin

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  aud_audio_core:
    git:
      url: git@github.com:audaudio/aud_audio_core.git
      tag_pattern: "{{version}}"
    version: ^0.5.4
  aud_audio_graph:
    git:
      url: git@github.com:audaudio/aud_audio_graph.git
      tag_pattern: "{{version}}"
    version: ^0.5.5
dev_dependencies:
  dna_audanika: ^0.0.2
  helix: ^1.13.0
  lints: ^6.1.0
  test: ^1.33.0
